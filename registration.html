<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MalwareGuard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --pink: #ff4f9a;
            --pink-light: #ff80b5;
            --pink-dark: #d9367c;
            --pink-glow: rgba(255, 79, 154, 0.35);
            --background: #0b0710;
            --border: #3a1c32;
            --text: #f8eaf2;
            --muted: #a8909d;
            --card-bg: linear-gradient(145deg, rgba(22, 13, 25, 0.97), rgba(17, 9, 20, 0.97));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(255, 79, 154, 0.14), transparent 32%), var(--background);
            color: var(--text);
        }

        body.light-mode {
            --background: #f8f3f7;
            --border: #f0d6e8;
            --text: #20171f;
            --muted: #635560;
            --card-bg: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(255,244,250,0.97));
        }

        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .auth-card {
            width: 100%;
            max-width: 470px;
            padding: 38px 32px 30px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45), 0 0 45px rgba(255, 79, 154, 0.06);
            backdrop-filter: blur(15px);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 26px;
            font-weight: 800;
        }

        .logo-shield {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--pink);
            border-radius: 12px;
            color: var(--pink);
            box-shadow: 0 0 18px var(--pink-glow);
        }

        .auth-logo span span {
            color: var(--pink);
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form-group label {
            color: #f1dfe8;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .input-box {
            position: relative;
            width: 100%;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #806879;
            font-size: 14px;
            pointer-events: none;
        }

        .input-box input {
            width: 100%;
            height: 50px;
            padding: 0 45px;
            color: var(--text);
            background: rgba(8, 5, 11, 0.65);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .input-box input::placeholder {
            color: #665560;
        }

        .input-box input:focus {
            border-color: var(--pink);
            background: rgba(12, 7, 15, 0.9);
            box-shadow: 0 0 0 3px rgba(255, 79, 154, 0.08), 0 0 18px rgba(255, 79, 154, 0.08);
        }

        .input-box:focus-within i {
            color: var(--pink);
        }

        .auth-btn {
            width: 100%;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, var(--pink), var(--pink-dark));
            box-shadow: 0 0 25px var(--pink-glow);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px var(--pink), 0 0 35px var(--pink-glow);
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .auth-footer a {
            color: var(--pink);
            font-weight: 700;
        }

        .auth-footer a:hover {
            color: var(--pink-light);
            text-shadow: 0 0 10px var(--pink-glow);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 20px 24px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span>Malware<span>Guard</span></span>
        </div>

        <form id="registerForm" class="register-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input id="name" name="name" type="text" placeholder="Full name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" name="email" type="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" placeholder="At least 8 characters" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="confirm_password" name="confirm_password" type="password" placeholder="Repeat password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input id="phone_number" name="phone_number" type="tel" placeholder="Your phone number" required>
                </div>
            </div>

            <div id="formStatus" style="display:none;padding:10px 12px;border-radius:8px;background:rgba(255,79,154,.08);border:1px solid rgba(255,79,154,.24);color:var(--pink-light);font-size:13px;"></div>

            <button id="continueBtn" class="auth-btn" type="button">Continue</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html?role=user">Login</a>
        </p>
    </div>

    <button class="theme-toggle" type="button" aria-label="Switch to light mode">
        <i class="fa-solid fa-moon"></i>
    </button>

    <script>
        const form = document.getElementById('registerForm');
        const continueBtn = document.getElementById('continueBtn');

        const statusBox = document.getElementById('formStatus');

        continueBtn.addEventListener('click', async function () {
            statusBox.style.display = 'none';
            if (!form.reportValidity()) return;

            const body = new URLSearchParams(new FormData(form));
            continueBtn.disabled = true;

            try {
                const response = await fetch('pre_register.php', { method: 'POST', body });
                const result = await response.json();

                if (!result.success) {
                    statusBox.textContent = result.message;
                    statusBox.style.display = 'block';
                    continueBtn.disabled = false;
                    return;
                }
                window.location.href = 'verification.html?p=' + encodeURIComponent(result.masked_phone);
            } catch (e) {
                statusBox.textContent = 'Unable to continue right now. Please try again.';
                statusBox.style.display = 'block';
                continueBtn.disabled = false;
            }
        });
    </script>
    <script src="assets/js/script.js"></script>
</body>
</html>
